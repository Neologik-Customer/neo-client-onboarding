name: Prepare Onboarding Zip
run-name: "${{ inputs.organizationCode != '' && inputs.organizationCode || '(Empty)' }} Prepare Onboarding Zip (${{ inputs.ref }})"

# Assembles a distributable onboarding kit: this repo zipped up with a generated
# inputs.json (built from the dispatch inputs below), uploaded to the central dev
# storage account, and surfaced as a time-limited public download link.
#
# Every input is validated against the same rules the onboarding script enforces.
# Optional fields left blank are omitted from inputs.json so the script falls back
# to its own defaults / prompts for them.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch (or ref) to build the onboarding kit from"
        required: false
        default: main
        type: string
      organizationCode:
        description: "Organization code — exactly 3 lowercase alphanumeric chars (e.g. xyz)"
        required: false
        default: ""
        type: string
      organizationName:
        description: "Organization name (e.g. XYZ Inc)"
        required: false
        default: ""
        type: string
      fqdn:
        description: "Bot hostname / full FQDN (e.g. xyzdev.neologik.ai)"
        required: false
        default: ""
        type: string
      environmentType:
        description: "Environment type"
        required: false
        default: dev
        type: choice
        options:
          - dev
          - prd
      azureRegion:
        description: "Azure region (e.g. uksouth)"
        required: false
        default: ""
        type: string
      environmentIndex:
        description: "Environment index 01-99"
        required: false
        default: ""
        type: string
      budgetCostReportEmailRecipients:
        description: "Budget / cost-report email recipient(s), comma-separated (blank = default support_budget_alerts@neologik.ai)"
        required: false
        default: ""
        type: string
      registerResourceProviders:
        description: "Register the FULL Azure resource provider set during onboarding (leave unchecked to register the minimal set and run Register-NeologikResourceProviders.ps1 separately)"
        required: false
        default: false
        type: boolean
      agentNames:
        description: "Bot agent name(s), comma-separated, max 3 (e.g. Finance Bot, HR Bot)"
        required: false
        default: ""
        type: string
      shortNames:
        description: "Bot short code(s), comma-separated, same count as agent names — lowercase, 1-4 chars (e.g. fin, hr)"
        required: false
        default: ""
        type: string
      skipGuestInvitation:
        description: "Skip inviting Neologik guest users (client provisions its own accounts, no B2B guests)"
        required: false
        default: false
        type: boolean
      useExistingServicePrincipal:
        description: "Use a client-provided deployment service principal instead of creating one (requires the object ID below)"
        required: false
        default: false
        type: boolean
      existingServicePrincipalObjectId:
        description: "Object ID of the pre-existing service principal (only when useExistingServicePrincipal is checked). The secret is supplied at runtime, never baked into the zip."
        required: false
        default: ""
        type: string
      resourceGroupName:
        description: "Resource group name override for client naming (blank = computed rg-neo-... default)"
        required: false
        default: ""
        type: string
      keyVaultName:
        description: "Key Vault name override for client naming — 3-24 chars, letters/digits/hyphens (blank = computed kvneo... default)"
        required: false
        default: ""
        type: string
      storageAccountName:
        description: "Deployment storage account name override for client naming — 3-24 lowercase alphanumeric (blank = computed stneodeploy... default)"
        required: false
        default: ""
        type: string
      scriptRunnerIdentityName:
        description: "Script-runner managed identity name override for client naming — 3-128 chars, letters/digits/hyphens/underscores (blank = computed neologik-script-runner-service-connection-... default)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  # Central dev-tenant storage account (neologik.dev)
  STORAGE_ACCOUNT: stmasterdevuks01
  STORAGE_CONTAINER: onboarding-zips
  SAS_EXPIRY_HOURS: "24"

jobs:
  prepare-zip:
    name: Prepare onboarding zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Validate and normalize inputs
        env:
          IN_ORG_CODE: ${{ inputs.organizationCode }}
          IN_ORG_NAME: ${{ inputs.organizationName }}
          IN_FQDN: ${{ inputs.fqdn }}
          IN_REGION: ${{ inputs.azureRegion }}
          IN_ENV_INDEX: ${{ inputs.environmentIndex }}
          IN_AGENT_NAMES: ${{ inputs.agentNames }}
          IN_SHORT_NAMES: ${{ inputs.shortNames }}
          IN_USE_EXISTING_SP: ${{ inputs.useExistingServicePrincipal }}
          IN_SP_OBJECT_ID: ${{ inputs.existingServicePrincipalObjectId }}
          IN_RG_NAME: ${{ inputs.resourceGroupName }}
          IN_KV_NAME: ${{ inputs.keyVaultName }}
          IN_SA_NAME: ${{ inputs.storageAccountName }}
          IN_SRI_NAME: ${{ inputs.scriptRunnerIdentityName }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # --- organizationCode: exactly 3 lowercase alphanumeric ---
          OC=""
          if [ -n "$IN_ORG_CODE" ]; then
            OC=$(printf '%s' "$IN_ORG_CODE" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$OC" | grep -Eq '^[a-z0-9]{3}$' \
              || fail "organizationCode must be exactly 3 lowercase alphanumeric characters (got '$IN_ORG_CODE')."
          fi

          # --- organizationName: non-blank when provided ---
          ON=""
          if [ -n "$IN_ORG_NAME" ]; then
            ON="$IN_ORG_NAME"
            [ -n "$(printf '%s' "$ON" | tr -d '[:space:]')" ] || fail "organizationName must not be blank."
          fi

          # --- fqdn: dotted, DNS-valid, lowercased (scheme/path stripped) ---
          FQ=""
          if [ -n "$IN_FQDN" ]; then
            FQ=$(printf '%s' "$IN_FQDN" | tr '[:upper:]' '[:lower:]')
            FQ=${FQ#*://}; FQ=${FQ%%/*}
            FQ=$(printf '%s' "$FQ" | sed -E 's/^\.+//; s/\.+$//')
            { printf '%s' "$FQ" | grep -q '\.' && printf '%s' "$FQ" | grep -Eq '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'; } \
              || fail "fqdn must be a valid fully-qualified domain name like xyz.neologik.ai (got '$IN_FQDN')."
          fi

          # --- azureRegion: lowercase region name (full validity checked by the script) ---
          RG=""
          if [ -n "$IN_REGION" ]; then
            RG=$(printf '%s' "$IN_REGION" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$RG" | grep -Eq '^[a-z]+[a-z0-9]*$' \
              || fail "azureRegion must be a valid Azure region name like uksouth (got '$IN_REGION')."
          fi

          # --- environmentIndex: 1-99, formatted to two digits ---
          EI=""
          if [ -n "$IN_ENV_INDEX" ]; then
            printf '%s' "$IN_ENV_INDEX" | grep -Eq '^[0-9]+$' || fail "environmentIndex must be a number between 01 and 99."
            n=$((10#$IN_ENV_INDEX))
            { [ "$n" -ge 1 ] && [ "$n" -le 99 ]; } || fail "environmentIndex must be between 01 and 99 (got '$IN_ENV_INDEX')."
            EI=$(printf '%02d' "$n")
          fi

          # --- bots: comma-separated agentNames / shortNames ---
          parse_csv() {
            local s="$1"
            if [ -z "$(printf '%s' "$s" | tr -d '[:space:]')" ]; then printf '[]';
            else jq -cn --arg s "$s" '$s | split(",") | map(gsub("^\\s+|\\s+$"; ""))'; fi
          }
          AGENTS=$(parse_csv "$IN_AGENT_NAMES")
          CODES=$(parse_csv "$IN_SHORT_NAMES")
          NA=$(jq 'length' <<<"$AGENTS"); NC=$(jq 'length' <<<"$CODES")
          [ "$NA" -eq "$NC" ] || fail "agentNames and shortNames must have the same number of comma-separated values (got $NA name(s) vs $NC code(s))."
          [ "$NA" -le 3 ] || fail "At most 3 bots are supported (got $NA)."

          CODES=$(jq -c 'map(ascii_downcase)' <<<"$CODES")   # short names are lowercased
          if [ "$NA" -gt 0 ]; then
            for i in $(seq 0 $((NA - 1))); do
              AN=$(jq -r ".[$i]" <<<"$AGENTS")
              SN=$(jq -r ".[$i]" <<<"$CODES")
              [ -n "$(printf '%s' "$AN" | tr -d '[:space:]')" ] || fail "bot agent name #$((i + 1)) is empty."
              printf '%s' "$AN" | grep -Eq '^[A-Za-z0-9 _-]+$' \
                || fail "agent name '$AN' may only contain letters, numbers, spaces, dashes and underscores."
              printf '%s' "$SN" | grep -Eq '^[a-z][a-z-]*$' \
                || fail "short name '$SN' must be lowercase, start with a letter, and contain only letters and dashes."
              { [ "${#SN}" -ge 1 ] && [ "${#SN}" -le 4 ]; } || fail "short name '$SN' must be 1-4 characters."
            done
            [ "$(jq 'group_by(.) | map(select(length > 1)) | length' <<<"$AGENTS")" -eq 0 ] || fail "agent names must be unique."
            [ "$(jq 'group_by(.) | map(select(length > 1)) | length' <<<"$CODES")" -eq 0 ] || fail "short names must be unique."
          fi
          BOTS=$(jq -cn --argjson a "$AGENTS" --argjson c "$CODES" \
            '[range(0; ($a | length)) | {agentName: $a[.], shortName: $c[.]}]')

          # --- existingServicePrincipalObjectId: GUID when provided; required if useExistingServicePrincipal ---
          SPID=""
          if [ -n "$IN_SP_OBJECT_ID" ]; then
            SPID="$IN_SP_OBJECT_ID"
            printf '%s' "$SPID" | grep -Eiq '^[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}$' \
              || fail "existingServicePrincipalObjectId must be a GUID (got '$IN_SP_OBJECT_ID')."
          fi
          if [ "$IN_USE_EXISTING_SP" = "true" ] && [ -z "$SPID" ]; then
            fail "useExistingServicePrincipal is checked but existingServicePrincipalObjectId is empty."
          fi

          # --- resourceGroupName: Azure RG naming (when provided) ---
          RGN=""
          if [ -n "$IN_RG_NAME" ]; then
            RGN="$IN_RG_NAME"
            { [ "${#RGN}" -ge 1 ] && [ "${#RGN}" -le 90 ]; } || fail "resourceGroupName must be 1-90 characters."
            printf '%s' "$RGN" | grep -Eq '^[A-Za-z0-9._()-]+$' || fail "resourceGroupName may only contain alphanumerics, underscores, hyphens, periods and parentheses."
            if printf '%s' "$RGN" | grep -Eq '\.$'; then fail "resourceGroupName cannot end with a period."; fi
          fi

          # --- keyVaultName: 3-24, start letter, letters/digits/hyphens, no double hyphen ---
          KVN=""
          if [ -n "$IN_KV_NAME" ]; then
            KVN="$IN_KV_NAME"
            { [ "${#KVN}" -ge 3 ] && [ "${#KVN}" -le 24 ]; } || fail "keyVaultName must be 3-24 characters."
            printf '%s' "$KVN" | grep -Eq '^[A-Za-z][A-Za-z0-9-]*[A-Za-z0-9]$' \
              || fail "keyVaultName must start with a letter, end with a letter or digit, and use only letters, digits and hyphens."
            if printf '%s' "$KVN" | grep -q -- '--'; then fail "keyVaultName cannot contain consecutive hyphens."; fi
          fi

          # --- storageAccountName: 3-24 lowercase alphanumeric ---
          SAN=""
          if [ -n "$IN_SA_NAME" ]; then
            SAN=$(printf '%s' "$IN_SA_NAME" | tr '[:upper:]' '[:lower:]')
            { [ "${#SAN}" -ge 3 ] && [ "${#SAN}" -le 24 ]; } || fail "storageAccountName must be 3-24 characters."
            printf '%s' "$SAN" | grep -Eq '^[a-z0-9]+$' || fail "storageAccountName must be lowercase letters and digits only (no hyphens)."
          fi

          # --- scriptRunnerIdentityName: 3-128, start letter/digit, letters/digits/hyphens/underscores ---
          SRN=""
          if [ -n "$IN_SRI_NAME" ]; then
            SRN="$IN_SRI_NAME"
            { [ "${#SRN}" -ge 3 ] && [ "${#SRN}" -le 128 ]; } || fail "scriptRunnerIdentityName must be 3-128 characters."
            printf '%s' "$SRN" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_-]*$' \
              || fail "scriptRunnerIdentityName must start with a letter or digit and use only letters, digits, hyphens and underscores."
          fi

          # --- export normalized values for the build step ---
          {
            echo "NORM_ORG_CODE=$OC"
            echo "NORM_ORG_NAME=$ON"
            echo "NORM_FQDN=$FQ"
            echo "NORM_REGION=$RG"
            echo "NORM_ENV_INDEX=$EI"
            echo "BOTS_JSON=$BOTS"
            echo "PARSED_BOT_COUNT=$NA"
            echo "NORM_SP_OBJECT_ID=$SPID"
            echo "NORM_RG_NAME=$RGN"
            echo "NORM_KV_NAME=$KVN"
            echo "NORM_SA_NAME=$SAN"
            echo "NORM_SRI_NAME=$SRN"
          } >> "$GITHUB_ENV"
          echo "Inputs validated. bots=$BOTS"

      - name: Build inputs.json and assemble zip
        env:
          IN_ENV_TYPE: ${{ inputs.environmentType }}
          IN_REGISTER_RPS: ${{ inputs.registerResourceProviders }}
          IN_BUDGET: ${{ inputs.budgetCostReportEmailRecipients }}
          IN_SKIP_GUESTS: ${{ inputs.skipGuestInvitation }}
          IN_USE_EXISTING_SP: ${{ inputs.useExistingServicePrincipal }}
        run: |
          set -euo pipefail

          # botCount is inferred from the number of named bots (blank when none given,
          # so the onboarding script falls back to its own default and prompts).
          if [ "${PARSED_BOT_COUNT:-0}" -gt 0 ]; then
            EFFECTIVE_BOT_COUNT="$PARSED_BOT_COUNT"
          else
            EFFECTIVE_BOT_COUNT=""
          fi

          # Parse the comma-separated budget recipients into a JSON array (empty = omitted).
          if [ -z "$(printf '%s' "${IN_BUDGET:-}" | tr -d '[:space:]')" ]; then
            BUDGET_JSON='[]'
          else
            BUDGET_JSON=$(jq -cn --arg s "$IN_BUDGET" \
              '$s | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          fi

          # Build inputs.json from the validated/normalized values (empties/nulls omitted, so the
          # onboarding script falls back to its own defaults / prompts for anything not provided).
          jq -n \
            --arg organizationCode "$NORM_ORG_CODE" \
            --arg organizationName "$NORM_ORG_NAME" \
            --arg fqdn "$NORM_FQDN" \
            --arg environmentType "$IN_ENV_TYPE" \
            --arg azureRegion "$NORM_REGION" \
            --arg environmentIndex "$NORM_ENV_INDEX" \
            --arg botCount "$EFFECTIVE_BOT_COUNT" \
            --argjson bots "${BOTS_JSON:-[]}" \
            --argjson budgetRecipients "$BUDGET_JSON" \
            --arg registerRPs "$IN_REGISTER_RPS" \
            --arg skipGuests "$IN_SKIP_GUESTS" \
            --arg useExistingSp "$IN_USE_EXISTING_SP" \
            --arg spObjectId "$NORM_SP_OBJECT_ID" \
            --arg rgName "$NORM_RG_NAME" \
            --arg kvName "$NORM_KV_NAME" \
            --arg saName "$NORM_SA_NAME" \
            --arg sriName "$NORM_SRI_NAME" \
            '
            {
              organizationCode: $organizationCode,
              organizationName: $organizationName,
              fqdn: $fqdn,
              environmentType: $environmentType,
              azureRegion: $azureRegion,
              environmentIndex: $environmentIndex,
              budgetCostReportEmailRecipients: (if ($budgetRecipients | length) == 0 then null else $budgetRecipients end),
              # Booleans and overrides are only emitted when explicitly set; otherwise omitted so
              # the script keeps its built-in default (minimal providers, invite guests, create SP,
              # computed resource names).
              registerResourceProviders: (if $registerRPs == "true" then true else null end),
              botCount: (if $botCount == "" then null else ($botCount | tonumber) end),
              bots: (if ($bots | length) == 0 then null else $bots end),
              skipGuestInvitation: (if $skipGuests == "true" then true else null end),
              useExistingServicePrincipal: (if $useExistingSp == "true" then true else null end),
              existingServicePrincipalObjectId: $spObjectId,
              resourceGroupName: $rgName,
              keyVaultName: $kvName,
              storageAccountName: $saName,
              scriptRunnerIdentityName: $sriName
            }
            | with_entries(select(.value != null and .value != ""))
            ' > inputs.json

          echo "Generated inputs.json:"
          cat inputs.json

          # Zip name: onboarding-script[-<orgcode>].zip
          if [ -n "$NORM_ORG_CODE" ]; then
            ZIP_NAME="onboarding-script-${NORM_ORG_CODE}.zip"
          else
            ZIP_NAME="onboarding-script.zip"
          fi
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          # Zip the repo (with the generated inputs.json) excluding VCS metadata.
          zip -r "../$ZIP_NAME" . -x '.git/*' >/dev/null
          mv "../$ZIP_NAME" "./$ZIP_NAME"
          echo "Created $ZIP_NAME ($(du -h "$ZIP_NAME" | cut -f1))"

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDS_NEO_DEV }}

      - name: Upload zip and generate download link
        id: upload
        run: |
          set -euo pipefail

          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$STORAGE_CONTAINER" \
            --name "$ZIP_NAME" \
            --file "$ZIP_NAME" \
            --auth-mode login \
            --overwrite true

          EXPIRY=$(date -u -d "+${SAS_EXPIRY_HOURS} hours" '+%Y-%m-%dT%H:%MZ')
          DOWNLOAD_URL=$(az storage blob generate-sas \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$STORAGE_CONTAINER" \
            --name "$ZIP_NAME" \
            --permissions r \
            --expiry "$EXPIRY" \
            --auth-mode login \
            --as-user \
            --https-only \
            --full-uri \
            --output tsv)

          echo "download-url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

          {
            echo "### 📦 Onboarding zip ready"
            echo ""
            echo "- **File:** \`$ZIP_NAME\`"
            echo "- **Expires:** $EXPIRY (24h)"
            echo ""
            echo "[⬇️ Download $ZIP_NAME]($DOWNLOAD_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
